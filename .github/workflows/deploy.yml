name: Build HED Production Site

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.js"
      - "index.source.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hed-production-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Publish compiled site to main root
        run: |
          git config user.name "HED Production Builder"
          git config user.email "actions@users.noreply.github.com"

          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
          cp dist/hed-logo.jpg ./hed-logo.jpg
          touch .nojekyll

          git add index.html assets hed-logo.jpg .nojekyll

          if git diff --cached --quiet; then
            echo "Production bundle is already current."
          else
            git commit -m "Deploy HED production bundle [skip ci]"
            git push origin main
          fi
