name: Build HED Production Site

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.js"
      - "index.source.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hed-production-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Recover verified HED property photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/property-images

          valid_webp() {
            local file="$1"
            [ -f "$file" ] || return 1
            local size riff webp
            size=$(wc -c < "$file")
            riff=$(head -c 4 "$file" || true)
            webp=$(dd if="$file" bs=1 skip=8 count=4 2>/dev/null || true)
            [ "$size" -ge 4000 ] && [ "$riff" = "RIFF" ] && [ "$webp" = "WEBP" ]
          }

          fetch_photo() {
            local output="$1"
            local source_file="$2"
            local target="public/property-images/$output"
            local temp="${target}.download"

            if valid_webp "$target"; then
              echo "Using verified local HED photo: $output"
              return 0
            fi

            echo "Recovering official HED photo: $output"
            rm -f "$temp"

            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              "https://wsrv.nl/?url=www.honestestatedevelopers.com/images/property/${source_file}&w=1600&output=webp&q=84" \
              --output "$temp"

            if ! valid_webp "$temp"; then
              size=$(wc -c < "$temp" 2>/dev/null || echo 0)
              echo "Invalid image received for $output (size=$size)"
              rm -f "$temp"
              exit 1
            fi

            mv "$temp" "$target"
            echo "Recovered and verified $output"
          }

          fetch_photo "gobero.webp" "199881115320230927122302pm.jpg"
          fetch_photo "kakiri-magogo.webp" "119185025120230921022129pm.jpg"
          fetch_photo "mabombwe.webp" "145657377020230922023441pm.jpg"
          fetch_photo "sisa-lutaba.webp" "150364507020231006041201pm.jpg"
          fetch_photo "namugongo-sonde.webp" "166002707620230926041943pm.jpg"
          fetch_photo "mpigi-mpambire.webp" "21025318020260608084742pm.jpg"

      - name: Recover verified Bujuuko House 4 media from Drive
        shell: bash
        run: |
          set -euo pipefail
          photo_dir="public/property-images/2026/bujuuko-house-4"
          video_dir="public/videos/2026/bujuuko-house-4"
          mkdir -p "$photo_dir" "$video_dir"

          fetch_drive_file() {
            local id="$1"
            local target="$2"
            local minimum="$3"
            local temp="${target}.download"
            rm -f "$temp"
            curl --fail --location --silent --show-error \
              --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 120 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              --output "$temp"
            local size
            size=$(wc -c < "$temp")
            if [ "$size" -lt "$minimum" ]; then
              echo "Drive download too small for $target: $size bytes"
              rm -f "$temp"
              exit 1
            fi
            mv "$temp" "$target"
            echo "Recovered $target ($size bytes)"
          }

          fetch_drive_file "1LWIGAug4kP0u-jXT8xi9emSpdn4rF7n1" "$photo_dir/20260917_142250.jpg" 100000
          fetch_drive_file "1SiSzKxb8RXpwjej67B5XKlqeNW3SS1FA" "$photo_dir/20260917_142253.jpg" 100000
          fetch_drive_file "1c0y_bHu5DCUszgd2myosImyRdNUXFY26" "$photo_dir/20260917_142405.jpg" 100000
          fetch_drive_file "16_xVTrp9OR6Q9cNwswb_8zlTcCOnn2Ar" "$photo_dir/20260917_142410.jpg" 100000
          fetch_drive_file "1fe9bqq3f0-I5pbL4L_VrCzrq2mNsjv29" "$photo_dir/20260917_142715.jpg" 100000
          fetch_drive_file "1FDN8l0uy7NNStC1bD4z3_MWo7rUdPFRg" "$photo_dir/20260917_142725.jpg" 100000
          fetch_drive_file "1I0D1Ux20VSC9CT_ev7cFQn6RXsaB3SMe" "$photo_dir/20260917_142950.jpg" 100000
          fetch_drive_file "12LhkJ7BNW76ZmOCzDFmXnVp31ZdMHEu0" "$photo_dir/20260917_142956.jpg" 100000
          fetch_drive_file "1jlJjf8MqgtYzOPrg0NPV7f7flnxXbfOL" "$video_dir/bujuuko-house-4-overview.mp4" 1000000

      - name: Build production bundle and optimized media
        run: npm run build

      - name: Publish compiled site to main root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HED Production Builder"
          git config user.email "actions@users.noreply.github.com"

          rm -rf assets media property-images videos docs
          mkdir -p property-images videos docs

          cp -R dist/assets ./assets
          cp -R dist/media ./media
          cp -R dist/videos/. ./videos/
          cp -R dist/docs/. ./docs/
          find dist/property-images -maxdepth 1 -type f -exec cp {} ./property-images/ \;
          cp dist/index.html ./index.html
          cp "dist/HED OFFICIAL LOGO.png" "./HED OFFICIAL LOGO.png"
          touch .nojekyll

          git add -A index.html assets media property-images videos docs "HED OFFICIAL LOGO.png" .nojekyll

          if git diff --cached --quiet; then
            echo "Production bundle is already current."
          else
            git commit -m "Deploy HED production bundle [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

# trigger: conflict-safe production publish
